name: 自动发布

permissions:
  contents: write
  pull-requests: write
  actions: write

on:
  push:
    branches:
      - main
    paths:
      - 'JavaScript/**'

# 关键：只有当提交消息符合规范时才触发
jobs:
  release:
    runs-on: ubuntu-latest
    # 这里是核心：只在提交消息包含 feat: / fix: 等时运行
    if: ${{ contains(github.event.head_commit.message, 'feat:') || contains(github.event.head_commit.message, 'fix:') || contains(github.event.head_commit.message, 'refactor:') || contains(github.event.head_commit.message, 'perf:') || contains(github.event.head_commit.message, 'feat!') || contains(github.event.head_commit.message, 'BREAKING CHANGE') }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 获取上次版本号(从tag)
        id: last_version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "last_version=0.0.0" >> $GITHUB_OUTPUT
          else
            echo "last_version=${LAST_TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: 根据最新提交计算新版本号
        id: version_bump
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          LAST_VERSION="${{ steps.last_version.outputs.last_version }}"
          
          IFS='.' read -ra PARTS <<< "$LAST_VERSION"
          MAJOR=${PARTS[0]:-0}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}

          NEW_VERSION="$LAST_VERSION"
          
          # Conventional Commits 标准判断
          if [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MSG" == *"feat!"* ]] || [[ "$COMMIT_MSG" == *"!"* && "$COMMIT_MSG" == *"feat:"* ]]; then
            # 破坏性变更：major +
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          elif [[ "$COMMIT_MSG" == *"feat:"* ]]; then
            # 新功能：minor +
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          elif [[ "$COMMIT_MSG" == *"fix:"* ]]; then
            # 修复：patch +
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          elif [[ "$COMMIT_MSG" == *"perf:"* ]] || [[ "$COMMIT_MSG" == *"refactor:"* ]]; then
            # 性能优化或重构：minor +
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          # 如果版本没变，就跳过发布
          if [ "$NEW_VERSION" = "$LAST_VERSION" ]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi

      # 以下步骤只有在版本需要更新时才执行
      - name: 更新脚本中的版本号（可选）
        if: steps.version_bump.outputs.skip_release == 'false'
        run: |
          sed -i "s/@version      .*/@version      ${{ steps.version_bump.outputs.new_version }}/" JavaScript/gipuls.js

      - name: 提交版本号更新（带 [skip ci] 避免循环）
        if: steps.version_bump.outputs.skip_release == 'false'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add JavaScript/gipuls.js
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version_bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:${{ github.ref }}

      - name: 创建标签并推送
        if: steps.version_bump.outputs.skip_release == 'false'
        run: |
          git tag -a "v${{ steps.version_bump.outputs.new_version }}" -m "Release v${{ steps.version_bump.outputs.new_version }}"
          git push origin "v${{ steps.version_bump.outputs.new_version }}"

      - name: 创建 GitHub Release
        if: steps.version_bump.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version_bump.outputs.new_version }}
          name: "版本 v${{ steps.version_bump.outputs.new_version }}"
          body: |
            ## 更新内容
            
            **${{ github.event.head_commit.message }}**
            
            完整提交: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}