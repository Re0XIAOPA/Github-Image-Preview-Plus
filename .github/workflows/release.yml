name: 自动发布

on:
  push:
    branches:
      - main
    paths:
      - 'JavaScript/**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 解析上次版本号
        id: last_version
        run: |
          LAST_VERSION=$(git tag --sort=-v:refname | head -n1 | sed 's/v//')
          if [ -z "$LAST_VERSION" ]; then
            LAST_VERSION="0.0.0"
          fi
          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT

      - name: 解析当前版本号
        id: current_version
        run: |
          VERSION=$(grep -oP '@version\s+\K[\d\.]+' JavaScript/gipuls.js)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 检查提交类型以确定版本更新
        id: version_bump
        run: |
          COMMIT_MESSAGE=$(git log --oneline -1)
          LAST_VERSION=${{ steps.last_version.outputs.last_version }}
          IFS='.' read -ra VERSION_PARTS <<< "$LAST_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # 检查是否包含破坏性变更标识
          if [[ "$COMMIT_MESSAGE" =~ BREAKING[[:space:]]CHANGE ]] || [[ "$COMMIT_MESSAGE" =~ ([Mm]ajor|[Bb]reaking) ]]; then
            # 破坏性变更，增加主版本号
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          elif [ "${COMMIT_MESSAGE:0:4}" = "feat" ]; then
            # 新功能提交，增加次版本号
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          elif [ "${COMMIT_MESSAGE:0:4}" = "fix" ]; then
            # 修复提交，增加修订号
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          elif [[ "${COMMIT_MESSAGE:0:4}" = "refa" ]] || [[ "${COMMIT_MESSAGE:0:4}" = "perf" ]]; then
            # 重构或性能优化，增加次版本号
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          else
            # 默认情况，增加修订号
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 更新脚本版本号
        run: |
          sed -i "s/@version      .*/@version      ${{ steps.version_bump.outputs.new_version }}/" JavaScript/gipuls.js
          
      - name: 提交版本号更新
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add JavaScript/gipuls.js
          git diff --staged --quiet || git commit -m "chore: 更新版本号到 ${{ steps.version_bump.outputs.new_version }}"
          git push
          
      - name: 创建标签
        run: |
          git tag -a v${{ steps.version_bump.outputs.new_version }} -m "Release v${{ steps.version_bump.outputs.new_version }}"
          git push origin v${{ steps.version_bump.outputs.new_version }}

      - name: 创建发布
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version_bump.outputs.new_version }}
          name: "版本 v${{ steps.version_bump.outputs.new_version }}"
          body: |
            ## 更新内容
            - 自动发布新版本
            - 根据提交类型更新版本号
            - major/breaking: 主版本号（破坏性变更）
            - feat: 新功能
            - fix: 问题修复
            - refactor: 代码重构
            - perf: 性能优化
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}